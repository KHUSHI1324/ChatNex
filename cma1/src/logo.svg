<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chatnex-logo-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00F5A0" />
      <stop offset="55%" stopColor="#00A884" />
      <stop offset="100%" stopColor="#007a5f" />
    </linearGradient>
    <linearGradient id="chatnex-logo-emblem" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#EAFFF7" />
    </linearGradient>
    <radialGradient id="chatnex-logo-highlight" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </radialGradient>
    <filter id="chatnex-logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" floodColor="#00a884" floodOpacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#chatnex-logo-bg)" filter="url(#chatnex-logo-shadow)" />
  
  <!-- Subtle Top Rim Light -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#chatnex-logo-highlight)" />
  <path d="M60 140C60 80 100 48 160 48H352C412 48 452 80 452 140" stroke="rgba(255, 255, 255, 0.4)" strokeWidth="10" strokeLinecap="round" />

  <!-- Modern Chat Bubble Emblem -->
  <path d="M140 160C140 137.9 157.9 120 180 120H332C354.1 120 372 137.9 372 160V290C372 312.1 354.1 330 332 330H248L186 376C176 383.5 160 376.5 160 363.8V330H180C157.9 330 140 312.1 140 290V160Z" fill="url(#chatnex-logo-emblem)" fillOpacity="0.96" />

  <!-- Deep Emerald Nexus 'N' / Signal Lightning Geometry -->
  <path d="M200 180V270C200 276.6 205.4 282 212 282C218.6 282 224 276.6 224 270V216L294 276.5C298.2 280.1 303.6 280.8 308.5 278.3C313.3 275.8 316.5 271 316.5 265.5V180C316.5 173.4 311.1 168 304.5 168C297.9 168 292.5 173.4 292.5 180V234L222.5 173.5C218.3 169.9 212.9 169.2 208 171.7C203.2 174.2 200 179 200 184.5V180Z" fill="#064e3b" />

  <!-- Dynamic Active Pulse Dot -->
