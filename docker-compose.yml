services:
  backend:
    build: ./cma node
    ports:
      - "1000:1000"
    env_file:
      - ./cma node/.env
    volumes:
      - uploads-data:/app/uploads
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build:
      context: ./cma1
      args:
        REACT_APP_API_URL: http://localhost:1000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  uploads-data: